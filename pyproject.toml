[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nwconfig-parser"
version = "0.1.0"
description = "各ベンダーのネットワーク機器のコマンド出力を共通データモデルへ変換するPythonライブラリ"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.0",
    "ruff>=0.9",
]

[project.scripts]
nwconfig-parser = "nwconfig_parser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nwconfig_parser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Preserve import-time compatibility with Python versions below the package minimum.
ignore = ["UP042"]

[tool.mypy]
files = ["src/nwconfig_parser"]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
